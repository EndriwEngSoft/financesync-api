name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financesync
          POSTGRES_PASSWORD: financesync_ci_password
          POSTGRES_DB: financesync_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: financesync_db
      DB_USER: financesync
      DB_PASSWORD: financesync_ci_password
      JWT_SECRET: chave-de-teste-para-ci-com-no-minimo-32-caracteres
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Copy application.properties.example
        run: cp src/main/resources/application.properties.example src/main/resources/application.properties

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B clean test
